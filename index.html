        .font-pinyin {

            letter-spacing: 0.08em;
            font-weight: 700;
        }
        .pinyin-hidden .char-py {

        .pinyin-hidden .pinyin-char-box {

        // 切换季节
        function switchSeason(seasonKey) {
            activeSeasonKey = seasonKey;
            const data = seasonalData[seasonKey];
            if (!data) return;

            // 更新选项卡样式
            ['spring', 'summer', 'autumn', 'winter'].forEach(key => {
                const tab = document.getElementById(`tab-${key}`);
                if (!tab) return;
                tab.className = "season-tab p-2.5 sm:p-3 rounded-2xl border-2 transition-all flex items-center justify-center gap-1.5 shadow-xs bg-white border-slate-200 text-slate-700 font-bold hover:border-amber-300";
            });

            const activeTab = document.getElementById(`tab-${seasonKey}`);
            if (activeTab) {
                const colorMap = {
                    spring: 'bg-emerald-50 border-emerald-400 text-emerald-950 ring-2 ring-emerald-300',
                    summer: 'bg-sky-50 border-sky-400 text-sky-950 ring-2 ring-sky-300',

                    winter: 'bg-indigo-50 border-indigo-400 text-indigo-950 ring-2 ring-indigo-300'
                };
                activeTab.className = `season-tab active p-2.5 sm:p-3 rounded-2xl border-2 transition-all flex items-center justify-center gap-1.5 shadow-xs font-bold ${colorMap[seasonKey]}`;
            }

            // 更新课本顶标
            const tagEl = document.getElementById('lessonSubTag');
            if (tagEl) tagEl.textContent = `【${data.subTitle}】`;

            // 渲染底层画卷 & 诗文排版
            renderTextbookLayout(data);

            // 渲染生字词卡片与微课堂
            renderVocabAndTrivia(data);

            // 更新背景粒子动效
            if (window.particleEngine) {
                window.particleEngine.setSeason(seasonKey);
            }
        }

        // 渲染字画一体的课本版式（支持词级卡拉OK点读与高亮）
        function renderTextbookLayout(data) {
            const bgContainer = document.getElementById('textbookBgArtwork');
            const poemContainer = document.getElementById('textbookPoemStage');

            // 1. 底层自然画卷
            if (seasonCustomImgs[data.id]) {
                bgContainer.innerHTML = `
                    <img src="${seasonCustomImgs[data.id]}" class="w-full h-full object-cover object-bottom" alt="${data.name}插画" />
                `;
            } else {
                bgContainer.innerHTML = data.bgSvg;
            }

            // 2. 表层规范大字诗句排版（严格绑定时间戳区间）
            poemContainer.innerHTML = data.lines.map((line, lineIdx) => {
                let unitsHtml = '';
                let lineStart = 999;
                let lineEnd = 0;

                line.units.forEach(unit => {
                    if (unit.punct) {
                        unitsHtml += `
                            <div class="flex flex-col items-center justify-end px-0.5 sm:px-1">
                                <span class="char-py font-pinyin text-transparent text-xs select-none pointer-events-none mb-1.5">·</span>
                                <span class="font-textbook text-2xl sm:text-4xl text-slate-800 leading-none">${unit.punct}</span>
                            </div>
                        `;
                    } else {
                        const ts = rawTimestamps[unit.tsIdx];
                        if (ts) {
                            if (ts.start < lineStart) lineStart = ts.start;
                            if (ts.end > lineEnd) lineEnd = ts.end;
                        }

                        let charsHtml = '';
                        for (let i = 0; i < unit.text.length; i++) {
                            const c = unit.text[i];
                            const py = unit.py[i] || '';
                            charsHtml += `
                                <div class="pinyin-char-box flex flex-col items-center justify-center px-1 sm:px-1.5 py-0.5">
                                    <span class="char-py font-pinyin text-amber-700 text-xs sm:text-sm font-bold tracking-normal leading-none mb-1.5 select-none transition-colors">${py}</span>
                                    <span class="char-cn font-textbook text-3xl sm:text-4xl sm:text-[42px] font-medium text-slate-900 leading-none select-none transition-colors">${c}</span>
                                </div>
                            `;
                        }

                        unitsHtml += `
                            <div id="word-unit-${unit.tsIdx}" 
                                 onclick="event.stopPropagation(); playWordTimestamp(${unit.tsIdx}, '${unit.text}')" 
                                 class="karaoke-word" 
                                 title="点击点读：${unit.text}">
                                ${charsHtml}
                            </div>
                        `;
                    }
                });

                return `
                    <div id="poem-line-${lineIdx}" 
                         onclick="playLineTimestamp(${lineStart}, ${lineEnd}, ${lineIdx})" 
                         class="flex items-center justify-center flex-wrap cursor-pointer px-3 py-1.5 transition-all duration-200 hover:sentence-active group">
                        <div class="flex items-end flex-wrap justify-center">
                            ${unitsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染字词卡片与微课堂（点击生字卡片也可直接触发 MP3 精确发声）
        function renderVocabAndTrivia(data) {
            const vocabCards = document.getElementById('seasonVocabCards');
            const triviaBox = document.getElementById('seasonKnowledgeContent');
            document.getElementById('vocabTitle').textContent = `${data.name}重点生字词宝盒`;
            document.getElementById('vocabBadgeIcon').textContent = data.badge;

            vocabCards.innerHTML = data.vocabList.map(item => {
                let clickAction = '';
                if (typeof item.tsIdx === 'number') {
                    clickAction = `playWordTimestamp(${item.tsIdx}, '${item.word}')`;
                } else if (typeof item.start === 'number' && typeof item.end === 'number') {
                    clickAction = `playAudioSlice(${item.start}, ${item.end}, '${item.word}')`;
                } else {
                    clickAction = `fallbackSpeak('${item.word}。${item.exp}')`;
                }

                return `
                    <div onclick="${clickAction}" class="bg-amber-50/60 hover:bg-amber-100/90 border border-amber-200/80 rounded-xl p-2.5 transition cursor-pointer flex flex-col justify-between hover:shadow-xs hover:border-amber-400 group">
                        <div>
                            <div class="flex items-center justify-between">
                                <span class="text-base group-hover:scale-110 transition">${item.icon}</span>
                                <i class="fa-solid fa-volume-low text-xs text-amber-600 group-hover:text-amber-800"></i>
                            </div>
                            <div class="font-pinyin text-[11px] text-amber-800 font-bold mt-0.5">${item.pinyin}</div>
                            <h4 class="font-textbook text-lg font-bold text-slate-900">${item.word}</h4>
                        </div>
                        <p class="text-[11px] text-slate-600 mt-1 line-clamp-2">${item.exp}</p>
                    </div>
                `;
            }).join('');

            triviaBox.innerHTML = data.trivia.map(t => `
                <div class="bg-white/80 p-2 rounded-xl flex items-start gap-2 shadow-2xs">
                    <span class="text-sm">${t.icon}</span>
                    <div>
                        <span class="font-bold text-amber-950">${t.title}：</span>
                        <span>${t.text}</span>
                    </div>
                </div>
            `).join('');
        }

        // 播放单个词对应的时间戳音频
        function playWordTimestamp(tsIdx, wordText) {
            const ts = rawTimestamps[tsIdx];
            if (!ts) return;

            if (isAudioLoaded) {
                playAudioSlice(ts.start, ts.end, wordText);
            } else {
                fallbackSpeak(wordText);
            }
        }

        // 播放一整行诗对应的时间戳音频
        function playLineTimestamp(start, end, lineIdx) {
            if (isAudioLoaded && start < end) {
                playAudioSlice(start, end);
            } else {
                const data = seasonalData[activeSeasonKey];
                if (data && data.lines[lineIdx]) {
                    const text = data.lines[lineIdx].units.map(u => u.text || u.punct).join('');
                    fallbackSpeak(text);
                }
            }
        }

        // 精准时间切片播放器（播放指定时间段并在终点自动停止）
        function playAudioSlice(start, end, highlightText) {
            if (!isAudioLoaded) return;

            clearActiveHighlights();
            if (playbackEndTimeout) clearTimeout(playbackEndTimeout);

            customAudio.pause();
            customAudio.currentTime = Math.max(0, start - 0.02); // 微量提前 20ms 避免削头
            customAudio.play();

            startKaraokeTracker();

            const duration = (end - start + 0.05) * 1000;
            playbackEndTimeout = setTimeout(() => {
                customAudio.pause();
                stopKaraokeTracker();
                clearActiveHighlights();
            }, duration);
        }

        // 朗读当前季节整页（从当前季起始秒播至当前季结束秒）
        function readActiveSeason() {
            const range = seasonRanges[activeSeasonKey];
            if (!range) return;

            if (isAudioLoaded) {
                clearActiveHighlights();
                if (playbackEndTimeout) clearTimeout(playbackEndTimeout);

                customAudio.pause();
                customAudio.currentTime = range.start;
                customAudio.play();
                startKaraokeTracker();

                const duration = (range.end - range.start) * 1000;
                playbackEndTimeout = setTimeout(() => {
                    customAudio.pause();
                    stopKaraokeTracker();
                    clearActiveHighlights();
                }, duration);
            } else {
                // 默认浏览器 TTS 朗读
                readActiveSeasonFallback();
            }
        }

        // 四季连读 (0.07s 到 30.27s 全程连贯播放，自动跨季节切页)
        function togglePlayFullPoem() {
            if (isFullPoemPlaying) {
                stopFullPoemPlayback();
            } else {
                startFullPoemPlayback();
            }
        }

        function startFullPoemPlayback() {
            if (!isAudioLoaded) {
                showMessage("💡 请先在上方导入儿歌 MP3 音频，体验真正的原声卡拉OK连读！");
                return;
            }

            isFullPoemPlaying = true;
            document.getElementById('fullPlayText').textContent = '暂停连读';
            document.getElementById('fullPlayIcon').className = 'fa-solid fa-pause';

            if (playbackEndTimeout) clearTimeout(playbackEndTimeout);
            customAudio.pause();
            customAudio.currentTime = 0.07;
            customAudio.play();

            startKaraokeTracker(true);
        }

        function stopFullPoemPlayback() {
            isFullPoemPlaying = false;
            document.getElementById('fullPlayText').textContent = '四季连读';
            document.getElementById('fullPlayIcon').className = 'fa-solid fa-play';

            if (playbackEndTimeout) clearTimeout(playbackEndTimeout);
            customAudio.pause();
            stopKaraokeTracker();
            clearActiveHighlights();
        }

        // 核心高精度卡拉OK时间追踪器（使用 requestAnimationFrame 实现 60fps 追踪）
        function startKaraokeTracker(autoSwitchSeason = false) {
            stopKaraokeTracker();

            function trackLoop() {
                const t = customAudio.currentTime;

                // 1. 若开启四季连读，自动根据当前秒数切换季节标签
                if (autoSwitchSeason || isFullPoemPlaying) {
                    if (t >= seasonRanges.winter.start && activeSeasonKey !== 'winter') {
                        switchSeason('winter');
                    } else if (t >= seasonRanges.autumn.start && t < seasonRanges.winter.start && activeSeasonKey !== 'autumn') {
                        switchSeason('autumn');
                    } else if (t >= seasonRanges.summer.start && t < seasonRanges.autumn.start && activeSeasonKey !== 'summer') {
                        switchSeason('summer');
                    } else if (t < seasonRanges.summer.start && activeSeasonKey !== 'spring') {
                        switchSeason('spring');
                    }

                    // 连读播完全文 (30.27s)
                    if (t >= 30.35 || customAudio.ended) {
                        stopFullPoemPlayback();
                        showMessage("🎉 太棒啦！《田家四季歌》连读圆满完成！");
                        return;
                    }
                }

                // 2. 匹配当前秒数落在哪个词元时间戳内
                let activeIdx = -1;
                for (let i = 0; i < rawTimestamps.length; i++) {
                    const ts = rawTimestamps[i];
                    if (t >= ts.start && t <= ts.end) {
                        activeIdx = i;
                        break;
                    }
                }

                // 3. 高亮或取消高亮对应的汉字词元
                document.querySelectorAll('.karaoke-word').forEach(el => {
                    el.classList.remove('karaoke-active');
                });

                if (activeIdx !== -1) {
                    const activeEl = document.getElementById(`word-unit-${activeIdx}`);
                    if (activeEl) {
                        activeEl.classList.add('karaoke-active');
                    }
                }

                if (!customAudio.paused && !customAudio.ended) {
                    animFrameId = requestAnimationFrame(trackLoop);
                } else {
                    stopKaraokeTracker();
                    clearActiveHighlights();
                }
            }

            animFrameId = requestAnimationFrame(trackLoop);
        }

        function stopKaraokeTracker() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        function clearActiveHighlights() {
            document.querySelectorAll('.karaoke-word').forEach(el => el.classList.remove('karaoke-active'));
        }

        // 默认语音合成兜底
        function fallbackSpeak(text, onEnd) {
            if (!('speechSynthesis' in window)) {
                if (onEnd) onEnd();
                return;
            }
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = speechRate;
            utter.pitch = 1.05;
            utter.onend = () => { if (onEnd) onEnd(); };
            utter.onerror = () => { if (onEnd) onEnd(); };
            window.speechSynthesis.speak(utter);
        }

        function readActiveSeasonFallback() {
            const data = seasonalData[activeSeasonKey];
            let index = 0;
            function next() {
                if (index >= data.lines.length) {
                    document.querySelectorAll('#textbookPoemStage > div').forEach(el => el.classList.remove('sentence-active'));
                    return;
                }
                document.querySelectorAll('#textbookPoemStage > div').forEach(el => el.classList.remove('sentence-active'));
                const target = document.getElementById(`poem-line-${index}`);
                if (target) target.classList.add('sentence-active');

                const text = data.lines[index].units.map(u => u.text || u.punct).join('');
                fallbackSpeak(text, () => {
                    index++;
                    setTimeout(next, 350);
                });
            }
            next();
        }

        // 处理用户上传 MP3 音频
        async function handleAudioUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            try {
                await applyCustomAudioBlob(file, true);
                showMessage("🎉 音频绑定成功！时间戳已精准映射，快点击诗句试听吧！");
            } catch (err) {
                showMessage("音频导入失败，请重试！");
            }
        }

        async function applyCustomAudioBlob(blob, saveToDb = false) {
            if (customAudioUrl) {
                URL.revokeObjectURL(customAudioUrl);
            }
            customAudioUrl = URL.createObjectURL(blob);
            customAudio.src = customAudioUrl;
            customAudio.preload = 'auto';
            isAudioLoaded = true;

            document.getElementById('audioStatusText').innerHTML = `
                <span class="text-emerald-800 font-bold">✨ 已激活您的儿歌 MP3：时间戳精准对齐就绪！</span>
            `;
            document.getElementById('clearAudioBtn').classList.remove('hidden');

            if (saveToDb) {
                try {
                    const db = await openAudioDB();
                    const tx = db.transaction('userAudioStore', 'readwrite');
                    tx.objectStore('userAudioStore').put(blob, 'savedSongAudio');
                } catch (e) {
                    console.warn('Could not save audio to IndexedDB:', e);
                }
            }
        }

        async function clearCustomAudio() {
            if (customAudioUrl) {
                URL.revokeObjectURL(customAudioUrl);
                customAudioUrl = null;
            }
            customAudio.src = '';
            isAudioLoaded = false;
            document.getElementById('audioStatusText').textContent = '时间戳已就绪（共 61 个高精词段，30.27 秒）。点击右侧一键导入您的 MP3 开始测试！';
            document.getElementById('clearAudioBtn').classList.add('hidden');

            try {
                const db = await openAudioDB();
                const tx = db.transaction('userAudioStore', 'readwrite');
                tx.objectStore('userAudioStore').delete('savedSongAudio');
                showMessage("已恢复为默认状态");
            } catch (e) {}
        }

        function openAudioDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('TianJiaSongAudioDB', 2);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('userAudioStore')) {
                        db.createObjectStore('userAudioStore');
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function initStoredAudio() {
            try {
                const db = await openAudioDB();
                const tx = db.transaction('userAudioStore', 'readonly');
                const store = tx.objectStore('userAudioStore');
                const req = store.get('savedSongAudio');
                req.onsuccess = () => {
                    if (req.result) {
                        applyCustomAudioBlob(req.result, false);
                    }
                };
            } catch (err) {
                console.log('IndexedDB audio skipped:', err);
            }
        }

        // 自定义更换本季插图
        function handleCustomBgUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const base64Data = e.target.result;
                seasonCustomImgs[activeSeasonKey] = base64Data;
                saveBgToIndexedDB(activeSeasonKey, base64Data);
                renderTextbookLayout(seasonalData[activeSeasonKey]);
            };
            reader.readAsDataURL(file);
        }

        function openBgDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open('TianJiaBgDB', 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('seasonImages')) {
                        db.createObjectStore('seasonImages');
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = () => resolve(null);
            });
        }

        async function saveBgToIndexedDB(seasonKey, base64Data) {
            const db = await openBgDB();
            if (!db) return;
            const tx = db.transaction('seasonImages', 'readwrite');
            tx.objectStore('seasonImages').put(base64Data, seasonKey);
        }

        async function loadStoredBgImages() {
            const db = await openBgDB();
            if (!db) return;
            const tx = db.transaction('seasonImages', 'readonly');
            const store = tx.objectStore('seasonImages');
            ['spring', 'summer', 'autumn', 'winter'].forEach(key => {
                const req = store.get(key);
                req.onsuccess = () => {
                    if (req.result) {
                        seasonCustomImgs[key] = req.result;
                        if (key === activeSeasonKey) {
                            renderTextbookLayout(seasonalData[activeSeasonKey]);
                        }
                    }
                };
            });
        }

        // 拼音开关与语速控制
        function togglePinyin() {
            isPinyinVisible = !isPinyinVisible;
            document.body.classList.toggle('pinyin-hidden', !isPinyinVisible);
            document.getElementById('pinyinBtnText').textContent = isPinyinVisible ? '拼音：开启' : '拼音：隐藏';
        }

        function setSpeed(rate) {
            speechRate = rate;
            customAudio.playbackRate = rate;
            document.getElementById('speedSlow').className = rate === 0.8 
                ? "px-1.5 py-0.5 rounded bg-amber-500 text-white shadow-xs font-bold"
                : "px-1.5 py-0.5 rounded text-amber-700 hover:bg-amber-200";
            document.getElementById('speedNormal').className = rate === 1.0 
                ? "px-1.5 py-0.5 rounded bg-amber-500 text-white shadow-xs font-bold"
                : "px-1.5 py-0.5 rounded text-amber-700 hover:bg-amber-200";
        }

        function showMessage(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-medium backdrop-blur-sm border border-amber-400 transition duration-300';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }

        // 季节背景粒子动效
        class SeasonParticleEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.season = 'spring';
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            setSeason(s) {
                this.season = s;
                this.particles = [];
                this.init();
            }
            init() {
                for (let i = 0; i < 20; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        size: Math.random() * 4 + 2,
                        vx: (Math.random() - 0.5) * 0.8,
                        vy: Math.random() * 1.2 + 0.4,
                        opacity: Math.random() * 0.4 + 0.2
                    });
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const colors = {
                    spring: 'rgba(244, 114, 182,',
                    summer: 'rgba(56, 189, 248,',
                    autumn: 'rgba(245, 158, 11,',
                    winter: 'rgba(186, 230, 253,'
                };
                const colorPrefix = colors[this.season] || colors.spring;

                this.particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    if (p.y > this.canvas.height) { p.y = -10; p.x = Math.random() * this.canvas.width; }
                    this.ctx.fillStyle = `${colorPrefix} ${p.opacity})`;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('fxCanvas');
            window.particleEngine = new SeasonParticleEngine(canvas);
            switchSeason('spring');
            initStoredAudio();
            loadStoredBgImages();
        });
    </script>
